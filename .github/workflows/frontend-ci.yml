name: Frontend CI

on:
  push:
    branches: [main, stage]
    paths:
      - "apps/frontend/**"
      - "packages/api-spec/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "apps/frontend/**"
      - "packages/api-spec/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/frontend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Lint
        run: pnpm --filter frontend lint
      - name: Typecheck
        run: pnpm --filter frontend typecheck
      - name: Test
        run: pnpm --filter frontend test
      - name: Build
        run: pnpm --filter frontend build

  client-drift:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Regenerate Kubb API client
        run: pnpm --filter frontend generate:api
      - name: Fail if Kubb-generated client is out of date
        run: git diff --exit-code -- apps/frontend/src/api/generated
