name: Backend CI

on:
  push:
    branches: [main, stage]
    paths:
      - "apps/backend/**"
      - "packages/api-spec/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - "packages/api-spec/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        working-directory: apps/backend
        run: uv sync
      - name: Lint
        working-directory: apps/backend
        run: uv run ruff check .
      - name: Format check
        working-directory: apps/backend
        run: uv run ruff format --check .
      - name: Test
        working-directory: apps/backend
        run: uv run pytest

  spec-drift:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        working-directory: apps/backend
        run: uv sync
      - name: Regenerate OpenAPI spec
        working-directory: apps/backend
        run: uv run python -m app.scripts.export_openapi
      - name: Fail if OpenAPI spec is out of date
        run: git diff --exit-code -- packages/api-spec/openapi.json
