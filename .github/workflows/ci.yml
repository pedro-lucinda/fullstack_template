name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        working-directory: apps/backend
        run: uv sync
      - name: Lint
        working-directory: apps/backend
        run: uv run ruff check .
      - name: Format check
        working-directory: apps/backend
        run: uv run ruff format --check .
      - name: Test
        working-directory: apps/backend
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Lint
        run: pnpm --filter frontend lint
      - name: Typecheck
        run: pnpm --filter frontend typecheck
      - name: Test
        run: pnpm --filter frontend test
      - name: Build
        run: pnpm --filter frontend build

  spec-consistency:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install backend dependencies
        working-directory: apps/backend
        run: uv sync
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Regenerate OpenAPI spec
        working-directory: apps/backend
        run: uv run python -m app.scripts.export_openapi
      - name: Fail if OpenAPI spec is out of date
        run: git diff --exit-code -- packages/api-spec/openapi.json
      - name: Regenerate Kubb API client
        run: pnpm --filter frontend generate:api
      - name: Fail if Kubb-generated client is out of date
        run: git diff --exit-code -- apps/frontend/src/api/generated

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: ast-grep scan
        run: pnpm exec ast-grep scan

